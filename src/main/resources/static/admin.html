<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .food-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-4 text-primary fw-bold">🍕 Pizza 4P's Admin Dashboard</h2>

    <div class="row">
        <div class="col-md-4">
            <div class="card p-4">
                <h4 class="mb-3">Add New Food</h4>
                <form id="addFoodForm">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea id="description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price (VNĐ)</label>
                        <input type="number" id="price" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category ID</label>
                        <select id="categoryId" class="form-select">
                            <option value="1">1 - Pizza</option>
                            <option value="2">2 - Appetizer</option>
                            <option value="3">3 - Drink</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image</label>
                        <input type="file" id="imageFile" class="form-control" accept="image/*">
                        <input type="hidden" id="imageUrl"> 
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Save Food</button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Food Menu</h4>
                    <button onclick="loadFoods()" class="btn btn-sm btn-outline-secondary">Refresh</button>
                </div>
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="foodTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8080/api";

    // 1. Hàm load danh sách món ăn
    async function loadFoods() {
        try {
            const response = await fetch(`${API_URL}/foods`);
            const foods = await response.json();
            
            const tbody = document.getElementById('foodTableBody');
            tbody.innerHTML = ''; // Xóa cũ

            foods.forEach(food => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${food.image}" class="food-img" onerror="this.src='https://via.placeholder.com/60'"></td>
                    <td>
                        <div class="fw-bold">${food.name}</div>
                        <small class="text-muted">${food.description.substring(0, 30)}...</small>
                    </td>
                    <td class="text-success fw-bold">${food.price.toLocaleString()}đ</td>
                    <td><button class="btn btn-sm btn-danger">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error loading foods:', error);
        }
    }

    // 2. Xử lý Form Submit
    document.getElementById('addFoodForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // Chặn reload trang

        // Bước A: Upload ảnh trước
        const fileInput = document.getElementById('imageFile');
        let uploadedImageUrl = "img_pizza_default"; // Mặc định nếu không chọn ảnh

        if (fileInput.files.length > 0) {
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const uploadRes = await fetch(`${API_URL}/images/upload`, {
                    method: 'POST',
                    body: formData
                });
                if (uploadRes.ok) {
                    uploadedImageUrl = await uploadRes.text(); // Nhận về URL ảnh từ Server
                }
            } catch (err) {
                alert("Upload failed!");
                return;
            }
        }

        // Bước B: Lưu thông tin món ăn (kèm link ảnh)
        const foodData = {
            name: document.getElementById('name').value,
            description: document.getElementById('description').value,
            price: parseFloat(document.getElementById('price').value),
            categoryId: parseInt(document.getElementById('categoryId').value),
            image: uploadedImageUrl
        };

        try {
            const res = await fetch(`${API_URL}/foods`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(foodData)
            });

            if (res.ok) {
                alert("Food added successfully!");
                document.getElementById('addFoodForm').reset();
                loadFoods(); // Load lại bảng
            }
        } catch (err) {
            alert("Error saving food");
        }
    });

    // Load dữ liệu khi mở trang
    loadFoods();
</script>

</body>
</html>
